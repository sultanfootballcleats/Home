<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop All Cleats — Sultan Football Cleats</title>
<meta name="description" content="Browse Sultan Football Cleats' full catalog of genuine pre-loved boots — adult and kids' studs and grippers, every pair a unique single unit and size." />
<link rel="icon" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="Sultan Football Cleats crest" />
      <span class="brand-text"><strong>Sultan</strong><span>Football Cleats</span></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <form class="search-box" action="shop.html" method="GET" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" name="q" placeholder="Search shoes or size…" aria-label="Search shoes or size" autocomplete="off" />
      </form>
      <button class="search-toggle" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <div class="currency-toggle" data-currency-toggle>
        <button data-currency="USD">USD</button>
        <button data-currency="PKR">PKR</button>
      </div>
      <a href="https://www.instagram.com/sultanfootballcleats/" target="_blank" rel="noopener" class="social-icon-link" aria-label="Sultan Football Cleats on Instagram" title="@sultanfootballcleats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="cart.html" class="cart-link" aria-label="View cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/></svg>
        <span data-cart-count class="cart-count">0</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle menu"></button>
    </div>
  </div>
</header>

<div class="wrap breadcrumb">
  <a href="index.html">Home</a><span>/</span><span>Shop</span>
</div>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div>
        <span class="eyebrow">Full Catalog</span>
        <h2>Shop All Cleats</h2>
      </div>
      <p>Genuine, pre-loved boots from Nike, Adidas, Puma and more — every pair is a single unique unit and size. Filter by category or sort to find yours.</p>
    </div>

    <div class="filters-bar">
      <div class="filter-pills" id="filterPills">
        <button class="filter-pill" data-cat="all">All</button>
        <button class="filter-pill" data-cat="adult-studs">Adult Studs</button>
        <button class="filter-pill" data-cat="kids-studs">Kids Studs</button>
        <button class="filter-pill" data-cat="adult-grippers">Adult Grippers</button>
        <button class="filter-pill" data-cat="kids-grippers">Kids Grippers</button>
      </div>
      <div style="display:flex; align-items:center; gap:16px;">
        <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          Filters
        </button>
        <span class="result-count" id="resultCount"></span>
        <select class="sort-select" id="sortSelect">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name">Name: A–Z</option>
        </select>
      </div>
    </div>

    <div class="filter-panel" id="filterPanel">
      <div class="filter-field">
        <label for="filterType">Type</label>
        <select id="filterType">
          <option value="all">Studs & Grippers</option>
          <option value="studs">Studs only</option>
          <option value="grippers">Grippers only</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="filterBrand">Brand</label>
        <select id="filterBrand">
          <option value="all">Any brand</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="filterSize">Size (UK)</label>
        <select id="filterSize">
          <option value="all">Any size</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="filterCondition">Condition</label>
        <select id="filterCondition">
          <option value="0">Any condition</option>
          <option value="4.5">4.5 stars & up</option>
          <option value="4">4 stars & up</option>
          <option value="3.5">3.5 stars & up</option>
          <option value="3">3 stars & up</option>
        </select>
      </div>
      <div class="filter-field">
        <label>Budget (PKR)</label>
        <div class="filter-budget-row">
          <input type="number" id="filterBudgetMin" placeholder="Min" min="0" inputmode="numeric" />
          <span>–</span>
          <input type="number" id="filterBudgetMax" placeholder="Max" min="0" inputmode="numeric" />
        </div>
      </div>
      <div class="filter-panel-actions">
        <button class="filter-reset" id="filterReset" type="button">Reset filters</button>
      </div>
    </div>

    <div class="product-grid" id="productGrid"><div class="empty-state" style="grid-column:1/-1;"><p>Loading pairs…</p></div></div>
  </div>
</section>

<footer class="site-footer" id="footer"></footer>

<script src="js/main.js"></script>
<script src="js/footer.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
